name: Build

on:
  push:
    branches: ["**"]
    # Release tags. Both styles exist in this repo's history ("0.1.26" and "v0.1.26"),
    # so match MAJOR.MINOR.PATCH with an optional leading v.
    tags: ["[0-9]*.*.*", "v[0-9]*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download DCCM MDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dccmZip = "$env:GITHUB_WORKSPACE\dccm.zip"
          $dccmRoot = "$env:GITHUB_WORKSPACE\dccm"
          # Use the direct release-asset URL (no API call) to avoid 403 from the
          # GitHub API on unauthenticated/anonymous requests. Mirrors build.ps1.
          $url = "https://github.com/dead-cells-core-modding/core/releases/latest/download/win-x64.zip"
          Write-Host "Downloading DCCM MDK from $url"
          Invoke-WebRequest -Uri $url -OutFile $dccmZip
          Expand-Archive -Path $dccmZip -DestinationPath $dccmRoot -Force
          $mdkRoot = "$dccmRoot\core\mdk"
          if (-not (Test-Path $mdkRoot)) {
            throw "DCCM MDK root not found: $mdkRoot"
          }
          "DCCM_MDK_ROOT=$mdkRoot" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          dotnet nuget remove source dccm-local 2>$null | Out-Null
          dotnet nuget add source "$mdkRoot\packages" --name dccm-local

      - name: Generate localization catalogs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The .mo catalogs are generated from Resourcefile/lang/main.zh.po and are gitignored
          # (never committed), so a clean checkout has none on disk. They ship inside the packed
          # res.pak, so without this step the artifact would carry no translation at all.
          # Mirrors the same step in build.ps1, including the interpreter probing: python3/py are
          # what a machine without the python alias actually has.
          $genScript = Join-Path $env:GITHUB_WORKSPACE 'Tools/gen_mo.py'
          if (-not (Test-Path $genScript)) {
            throw "Tools/gen_mo.py not found at $genScript"
          }

          $python = $null
          foreach ($candidate in @('python', 'python3', 'py')) {
            if (Get-Command $candidate -ErrorAction SilentlyContinue) {
              $python = $candidate
              break
            }
          }
          if (-not $python) {
            throw "Python 3 is required to generate localization files (Tools/gen_mo.py) but was not found on PATH."
          }

          Write-Host "Generating localization .mo files with $python ($genScript)"
          & $python $genScript
          if ($LASTEXITCODE -ne 0) {
            throw "Localization generation failed (exit code $LASTEXITCODE)."
          }

      - name: Build
        run: dotnet build -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeadCellsLocalMultiplayerMod
          path: bin/Release/net10.0/win-x64/output/DeadCellsLocalMultiplayerMod/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout (for CHANGELOG extraction and the csproj version check)
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: DeadCellsLocalMultiplayerMod
          path: dist

      - name: Pack and extract release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${{ github.ref_name }}"
          # "0.1.26" and "v0.1.26" both appear in this repo's history; strip the v.
          $bare = $tag -replace '^v', ''
          $version = "v$bare"

          # Guard against the classic mistake: the tag moved but the project sources
          # (csproj Version, BuildInfo.Version) were not bumped to match.
          $csproj = Get-Content DeadCellsLocalMultiplayerMod.csproj -Raw
          if ($csproj -notmatch "<Version>$([regex]::Escape($bare))</Version>") {
            throw "Tag $tag does not match DeadCellsLocalMultiplayerMod.csproj <Version> ($bare expected)."
          }

          # Release notes: the CHANGELOG.md section for this exact version, followed by
          # the matching CHANGELOG_zh.md section (the project ships both languages).
          # Both files use the same "## [x.y.z] — date" section headers.
          function Get-ChangeSection([string]$file) {
            if (-not (Test-Path $file)) { return $null }
            $lines = Get-Content $file
            $start = ($lines | Select-String -Pattern "^## \[$([regex]::Escape($bare))\]" | Select-Object -First 1).LineNumber
            if (-not $start) { return $null }
            $body = New-Object System.Collections.Generic.List[string]
            for ($i = $start; $i -lt $lines.Count; $i++) {
              $line = $lines[$i]
              # The next "## [" header closes this version's section.
              if ($line -match '^## \[') { break }
              $body.Add($line)
            }
            $text = ($body -join "`n").Trim()
            if ($text) { return $text }
            return $null
          }

          $en = Get-ChangeSection 'CHANGELOG.md'
          $zh = Get-ChangeSection 'CHANGELOG_zh.md'
          if (-not $en -and -not $zh) {
            throw "No '## [$bare]' section found in CHANGELOG.md or CHANGELOG_zh.md."
          }
          $notes = @()
          if ($en) { $notes += $en }
          if ($zh) {
            if ($en) { $notes += '' ; $notes += '<details>' ; $notes += '<summary>中文</summary>' ; $notes += '' }
            $notes += $zh
            if ($en) { $notes += '' ; $notes += '</details>' }
          }
          $notes = $notes -join "`n"

          # The artifact is the packed mod folder (assemblies + res.pak + modinfo.json);
          # ship it as one zip named after the release, with a top-level folder so
          # extracting it never splats files into the cwd.
          $zip = "$env:GITHUB_WORKSPACE/DeadCellsLocalMultiplayerMod-$version.zip"
          $stage = "$env:GITHUB_WORKSPACE/staging/DeadCellsLocalMultiplayerMod"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path dist/* -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath $zip

          $notesPath = "$env:GITHUB_WORKSPACE/release-notes.md"
          Set-Content -Path $notesPath -Value $notes -Encoding utf8
          Write-Host "Release notes ($version):`n$notes"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Draft off, so pushing the tag publishes immediately; that matches how the
          # project's existing tags (no drafts) are used.
          draft: false
          prerelease: false
          body_path: release-notes.md
          files: DeadCellsLocalMultiplayerMod-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
